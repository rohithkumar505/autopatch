[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autopatch"
version = "0.2.0"
description = "Autonomous bug detection and repair for software projects"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "ruff>=0.6",
    "pylint>=3.2",
    "pytest>=8",
    "hypothesis>=6",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]

[project.scripts]
autopatch = "autopatch.main:run"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["autopatch*"]

[tool.setuptools.package-data]
autopatch = ["testing/*.py", "testing/docker/*", "analysis/*.toml"]

[tool.pytest.ini_options]
# Only AutoPatch's own tests. Sample projects have their own tests, which
# AutoPatch runs inside its sandbox.
testpaths = ["backend/tests"]
pythonpath = ["backend"]
